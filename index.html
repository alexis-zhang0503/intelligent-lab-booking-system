<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智能实验室预约系统">
  <meta name="theme-color" content="#090f18">
  <title>智能实验室预约系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <main id="auth" class="auth">
    <section class="intro">
      <p class="eyebrow">NUPT / LAB ACCESS</p>
      <h1>让每一台设备<br>都被清晰预约。</h1>
      <p>面向课程实验室的预约、座位与设备状态管理工作台。</p>
      <div class="metrics"><div><b>40</b><span>实验设备</span></div><div><b>09</b><span>开放时段</span></div><div><b>02</b><span>使用角色</span></div></div>
    </section>
    <section class="auth-card">
      <div class="tabs"><button class="tab active" data-tab="login">登录</button><button class="tab" data-tab="register">注册</button></div>
      <form id="loginForm"><h2>欢迎回来</h2><p>使用已注册账号进入实验室工作台。</p><label>学号 / 工号<input name="loginId" required maxlength="20" autocomplete="username"></label><label>密码<input name="password" required minlength="4" type="password" autocomplete="current-password"></label><button class="primary">进入系统 <span>→</span></button></form>
      <form id="registerForm" hidden><h2>创建账号</h2><p>管理员和学生均通过注册获得账号。</p><label>姓名<input name="name" required maxlength="16"></label><label>学号 / 工号<input name="loginId" required maxlength="20"></label><label>身份<select name="role"><option value="student">学生</option><option value="admin">管理员</option></select></label><label>密码<input name="password" required minlength="4" type="password" autocomplete="new-password"></label><button class="primary">注册并进入 <span>→</span></button></form>
    </section>
  </main>
  <main id="app" class="app" hidden>
    <aside class="side"><a class="logo" href="#"><i>L</i>LAB<span>/40</span></a><div id="profile" class="profile"></div><nav id="nav"></nav><p class="local-note">数据仅保存在本浏览器</p><button id="logout" class="link-btn">退出登录</button></aside>
    <section class="main"><header><div><p id="kicker" class="eyebrow"></p><h1 id="title"></h1></div><div class="head-actions"><em><i></i>本地数据已同步</em><button id="countFile" class="outline">下载 count.txt</button><button id="errorFile" class="outline">下载 error.txt</button></div></header><div id="content"></div></section>
  </main>
  <dialog id="faultModal"><form id="faultForm"><div class="modal-title"><div><p class="eyebrow">DEVICE REPORT</p><h2>上报设备故障</h2></div><button class="x" type="button" id="closeModal" aria-label="关闭">×</button></div><label>电脑编号<select id="faultDesk"></select></label><label>故障描述<textarea id="faultText" required maxlength="120" placeholder="例如：显示器无信号，无法开机"></textarea></label><button class="primary">提交故障记录 <span>→</span></button></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
