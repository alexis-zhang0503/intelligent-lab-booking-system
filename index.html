<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="智能实验室预约系统">
  <meta name="theme-color" content="#f5f5f7">
  <title>智能实验室预约系统</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="refinement.css">
</head>
<body>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <main id="auth" class="auth">
    <a class="auth-brand" href="#"><img src="favicon.svg" alt="">NJUPT <span>实验室预约</span></a>
    <div class="language-switch auth-language" aria-label="Language"><button type="button" data-language="en">EN</button><button type="button" data-language="zh">中文</button></div>
    <section class="intro">
      <p class="eyebrow">LAB RESERVATION</p>
      <h1>实验室预约<br>把时间留给探索</h1>
      <p>选定设备，约好时间。把注意力留给实验本身。</p>
    </section>
    <section class="auth-card">
      <div class="tabs"><button class="tab active" data-tab="login">登录</button><button class="tab" data-tab="register">注册</button></div>
      <form id="loginForm"><h2>开始预约</h2><p>登录后，设备、时段和你的记录，都在这里。</p><label>学号 / 工号<input name="loginId" required maxlength="20" autocomplete="username"></label><label>密码<input name="password" required minlength="4" type="password" autocomplete="current-password"></label><button class="primary">登录并继续 <span>→</span></button></form>
      <form id="registerForm" hidden><h2>创建学生账号</h2><p>学生可直接注册。管理员账号由项目维护者在后台开通。</p><label>姓名<input name="name" required maxlength="16"></label><label>学号<input name="loginId" required maxlength="20"></label><label>密码<input name="password" required minlength="4" type="password" autocomplete="new-password"></label><button class="primary">注册并进入 <span>→</span></button></form>
    </section>
  </main>
  <main id="app" class="app" hidden>
    <aside class="side"><a class="logo" href="#"><img src="favicon.svg" alt="">NJUPT<span>实验室预约</span></a><nav id="nav"></nav><div class="language-switch app-language" aria-label="Language"><button type="button" data-language="en">EN</button><button type="button" data-language="zh">中文</button></div><div id="profile" class="profile"></div><button id="logout" class="link-btn">退出</button></aside>
    <section class="main"><header><div><p id="kicker" class="eyebrow"></p><h1 id="title"></h1></div></header><div id="content"></div></section>
  </main>
  <div id="entryOverlay" class="entry-overlay" hidden aria-hidden="true"><div class="entry-core"><img src="favicon.svg" alt=""><span>NJUPT</span><i></i></div><p>正在进入实验室</p></div>
  <div id="bookingOverlay" class="booking-overlay" hidden aria-hidden="true"><section class="booking-confirmation" role="status" aria-live="polite"><div class="booking-check" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="m14 24 7 7 14-15"/></svg></div><p class="eyebrow">RESERVATION CONFIRMED</p><h2>预约已确认</h2><p id="bookingOverlayCopy">设备与时间已为你保留</p></section></div>
  <dialog id="faultModal"><form id="faultForm"><div class="modal-title"><div><p class="eyebrow">DEVICE REPORT</p><h2>上报设备故障</h2></div><button class="x" type="button" id="closeModal" aria-label="关闭">×</button></div><label>电脑编号<select id="faultDesk"></select></label><label>故障描述<textarea id="faultText" required maxlength="120" placeholder="例如：显示器无信号，无法开机"></textarea></label><button class="primary">提交故障记录 <span>→</span></button></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
