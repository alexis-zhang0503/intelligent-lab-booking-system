name: Build macOS native C release
on:
  push:
    branches: [main]
    paths:
      - 'desktop-c/**'
      - '.github/workflows/release-macos.yml'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install gtk+3 pkg-config dylibbundler
      - name: Build app and run C tests
        run: bash desktop-c/macos/build.sh
      - name: Verify relocated app startup
        run: |
          mv desktop-c/dist/LabReservation.app /tmp/LabReservation.app
          /tmp/LabReservation.app/Contents/MacOS/LabReservation --smoke-test &
          pid=$!
          sleep 3
          kill -0 "$pid"
          wait "$pid"
          mv /tmp/LabReservation.app desktop-c/dist/LabReservation.app
      - name: Capture native UI fixtures
        run: |
          mkdir -p desktop-c/previews
          for page in login booking profile agent; do
            desktop-c/dist/LabReservation.app/Contents/MacOS/LabReservation "--preview=$page" "--preview-output=$PWD/desktop-c/previews/macos-$page.png"
            test -s "desktop-c/previews/macos-$page.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-macos-${{ matrix.arch }}
          path: desktop-c/previews/
      - name: Package app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent desktop-c/dist/LabReservation.app "LabReservation-macOS-$ARCH.zip"
          shasum -a 256 "LabReservation-macOS-$ARCH.zip" > "SHA256SUMS-macOS-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: LabReservation-macOS-${{ matrix.arch }}
          path: |
            LabReservation-macOS-*.zip
            SHA256SUMS-macOS-*.txt
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "LabReservation-macOS-$ARCH.zip" "SHA256SUMS-macOS-$ARCH.txt" --repo "$GITHUB_REPOSITORY" --clobber
